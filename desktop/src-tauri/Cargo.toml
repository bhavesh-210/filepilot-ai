[package]
name = "filepilot-desktop"
version = "0.2.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = {version="2",features=[]}
serde_json = "1"

[dependencies]
tauri = {version="2",features=[]}
serde = {version="1",features=["derive"]}
serde_json = "1"
rusqlite = {version="0.41.1",features=["bundled"]}
filepilot-core = {path="../../native/core"}
notify = "8"
libc = "0.2"
