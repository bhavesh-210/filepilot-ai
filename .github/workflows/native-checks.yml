name: native app checks
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'native/**'
      - '.github/workflows/native-checks.yml'
      - 'scripts/check_desktop_browser.py'
      - 'scripts/build_pdf_helper.sh'
      - 'scripts/check_native_pdf.py'
      - 'requirements-browser-tests.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filepilot-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Native core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Use the tested Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Test synthetic filesystem operations
        run: cargo +1.99.1 test --locked --manifest-path native/core/Cargo.toml
  desktop:
    name: Build macOS application
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Use the tested Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test native Swift helpers without opening permission dialogs
        run: |
          xcrun swiftc desktop/src-tauri/macos/Mac.swift desktop/src-tauri/macos/check/main.swift -o /tmp/filepilot-mac-check -framework AppKit -framework Foundation -framework ServiceManagement -framework NaturalLanguage
          /tmp/filepilot-mac-check
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Build and test the isolated PDF parser
        run: |
          bash scripts/build_pdf_helper.sh
          python3 scripts/check_native_pdf.py
      - name: Compile and bundle the app
        working-directory: desktop
        run: npm run tauri -- build --target universal-apple-darwin --bundles app
      - name: Preserve the application bundle and executable permissions
        run: ditto -c -k --keepParent "desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/FilePilot AI.app" FilePilot-macOS-development.zip
      - name: Save the unsigned development app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: FilePilot-macOS-development
          path: FilePilot-macOS-development.zip
          if-no-files-found: error
          retention-days: 7

  browser:
    name: React desktop browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Build the production frontend
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Install browser test tools
        run: |
          python -m pip install --only-binary=:all: -r requirements-browser-tests.txt
          python -m playwright install --with-deps chromium
      - name: Test synthetic frontend workflows
        run: python scripts/check_desktop_browser.py
