[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filepilot-ai"
version = "0.1.4"
description = "Offline, read-only filesystem inventory prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
documents = ["pypdf==7.0.1"]
research = ["scikit-learn==1.8.0"]

[project.scripts]
filepilot = "filepilot.cli:main"
filepilot-check = "filepilot.check:main"
filepilot-inspect = "filepilot.content:main"

[tool.setuptools.packages.find]
where = ["src"]
